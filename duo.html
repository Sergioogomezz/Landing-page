<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activo Dúo · Encuentra con quién entrenar</title>
<meta name="description" content="Encuentra compañeros de entreno en tu gimnasio: mismo objetivo, mismo horario.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003b46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Activo Dúo">
<link rel="manifest" href="duo.webmanifest">
<link rel="icon" href="assets/img/duo-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/img/duo-touch.png">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap; src: url('assets/fonts/inter-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --p: #003b46; --a: #e05e00;
  --p-soft: color-mix(in srgb, var(--p) 9%, #fff); --p-line: color-mix(in srgb, var(--p) 18%, #fff); --p-deep: color-mix(in srgb, var(--p) 82%, #000);
  --a-soft: color-mix(in srgb, var(--a) 12%, #fff); --a-btn: color-mix(in srgb, var(--a) 88%, #000);
  --ink: #0f1f24; --text: #33464b; --muted: #5f6f74; --line: #e4eaeb; --bg: #f2f5f6; --card: #fff;
  --ok: #127a3f; --ok-soft: #e9f7ef; --bad: #b42318; --bad-soft: #fdecea;
  --shadow: 0 1px 2px rgba(15,31,36,.05), 0 8px 24px -10px rgba(15,31,36,.18);
  --tab-h: 64px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--a); outline-offset: 2px; border-radius: 8px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; background: var(--bg); }
@media (min-width: 560px) { body { background: linear-gradient(160deg, var(--p-deep), var(--p) 60%, color-mix(in srgb, var(--p) 70%, var(--a))); } .wrap { box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); } }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 14px; font-weight: 800; font-size: 15px; line-height: 1.2; border: 1.5px solid transparent; transition: transform .12s ease, background-color .15s, opacity .15s; text-align: center; }
.btn:active { transform: scale(.98); }
.btn .ico { width: 18px; height: 18px; }
.btn-a { background: var(--a-btn); color: #fff; box-shadow: 0 10px 22px -12px var(--a); }
.btn-p { background: var(--p); color: #fff; }
.btn-o { background: #fff; color: var(--p); border-color: var(--p-line); }
.btn-g { color: var(--p); padding: 10px 12px; }
.btn-w { background: #fff; color: var(--p); }
.btn-wa { background: #128c4a; color: #fff; }
.btn-sm { padding: 9px 13px; font-size: 13.5px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { color: var(--p); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; }

/* Demostración */
.demo-bar { position: relative; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); background: #1f2937; color: #fde68a; font-size: 12px; font-weight: 700; }
.demo-bar button { color: #fff; text-decoration: underline; font-size: 12px; font-weight: 700; }

/* Carga y error */
.center { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px; text-align: center; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--p-line); border-top-color: var(--p); animation: spin 1s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.err h1 { font-size: 22px; color: var(--ink); margin: 14px 0 8px; }
.err p { color: var(--muted); }
.err .ico-big { width: 64px; height: 64px; border-radius: 20px; background: var(--p-soft); color: var(--p); display: grid; place-items: center; margin: 0 auto; }
.err .ico-big .ico { width: 30px; height: 30px; }

/* Bienvenida */
.hero { position: relative; overflow: hidden; color: #fff; padding: 28px 22px 30px; padding-top: calc(28px + env(safe-area-inset-top)); background: radial-gradient(420px 260px at 100% 0%, color-mix(in srgb, var(--a) 45%, transparent), transparent 65%), linear-gradient(160deg, var(--p-deep), var(--p)); border-radius: 0 0 30px 30px; }
.hero::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
.hero > * { position: relative; }
.gym-row { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.gym-logo { width: 48px; height: 48px; border-radius: 14px; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none; color: var(--p); font-weight: 900; font-size: 18px; box-shadow: 0 6px 18px -6px rgba(0,0,0,.4); }
.gym-logo img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.gym-row b { display: block; font-size: 16px; font-weight: 800; }
.gym-row span { font-size: 12px; color: rgba(255,255,255,.72); font-weight: 600; letter-spacing: .04em; }
.hero h1 { font-size: 36px; line-height: 1.04; letter-spacing: -.03em; font-weight: 900; margin-bottom: 12px; }
.hero h1 em { font-style: normal; color: color-mix(in srgb, var(--a) 70%, #fff); }
.hero p { font-size: 16px; color: rgba(255,255,255,.82); max-width: 380px; }
.bands { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.band { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font-size: 12px; font-weight: 700; }
.band i { width: 22px; height: 9px; border-radius: 99px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.welcome-b { padding: 22px 20px calc(120px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.feat { display: flex; gap: 14px; align-items: flex-start; background: var(--card); border-radius: 18px; padding: 15px 16px; box-shadow: var(--shadow); }
.feat .fi { width: 40px; height: 40px; border-radius: 12px; background: var(--p-soft); color: var(--p); display: grid; place-items: center; flex: none; }
.feat b { display: block; color: var(--ink); font-size: 15px; }
.feat span { font-size: 13.5px; color: var(--muted); }
.cta-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(242,245,246,0), var(--bg) 30%); z-index: 20; display: grid; gap: 8px; text-align: center; }
.cta-bar small { font-size: 12px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); text-align: center; }

/* Asistente de alta */
.wz-top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 18px 10px; padding-top: calc(14px + env(safe-area-inset-top)); }
.wz-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.wz-nav .step { font-size: 12.5px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.prog { height: 6px; border-radius: 99px; background: var(--p-line); overflow: hidden; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--p), var(--a)); border-radius: 99px; transition: width .35s ease; }
.wz-b { padding: 8px 18px calc(110px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
.wz-b h2 { font-size: 26px; line-height: 1.12; letter-spacing: -.02em; color: var(--ink); font-weight: 900; }
.wz-b .sub { color: var(--muted); font-size: 14.5px; margin-top: -8px; }
.field { display: grid; gap: 7px; }
.field > span { font-size: 13px; font-weight: 800; color: var(--ink); }
.field small { font-size: 12.5px; color: var(--muted); }
.input, .textarea, .select { width: 100%; padding: 14px 15px; border-radius: 14px; border: 1.5px solid #d3dcde; background: #fff; font-size: 16px; color: var(--ink); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 4px var(--p-soft); }
.textarea { resize: none; min-height: 80px; }
.photo { display: flex; align-items: center; gap: 14px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--p-soft); color: var(--p); display: grid; place-items: center; font-weight: 900; font-size: 22px; overflow: hidden; flex: none; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.ring { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--ring, var(--p)); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px 15px; border-radius: 16px; background: #fff; border: 2px solid transparent; box-shadow: var(--shadow); text-align: left; transition: border-color .15s, background .15s; }
.opt.on { border-color: var(--p); background: var(--p-soft); }
.opt .pul { width: 38px; height: 16px; border-radius: 99px; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 6px -2px rgba(0,0,0,.3); }
.opt b { display: block; color: var(--ink); font-size: 15px; }
.opt span { font-size: 12.5px; color: var(--muted); }
.opt .chk { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c6d1d3; display: grid; place-items: center; flex: none; color: #fff; }
.opt.on .chk { background: var(--p); border-color: var(--p); }
.opt .chk .ico { width: 14px; height: 14px; stroke-width: 3; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #e4eaeb; padding: 4px; border-radius: 14px; }
.seg button { padding: 10px 6px; border-radius: 11px; font-weight: 800; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: #fff; color: var(--p); box-shadow: 0 2px 8px -2px rgba(0,0,0,.15); }
.seg.two { grid-template-columns: 1fr 1fr; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 999px; background: #fff; border: 1.5px solid #d3dcde; font-weight: 700; font-size: 14px; color: var(--text); }
.chip.on { background: var(--p); border-color: var(--p); color: #fff; }
.chip i { width: 10px; height: 10px; border-radius: 50%; }
.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.scroll .chip { flex: none; white-space: nowrap; padding: 9px 13px; font-size: 13.5px; }
.scroll::-webkit-scrollbar { display: none; }
.grid-h { display: grid; grid-template-columns: 74px repeat(7, 1fr); gap: 5px; background: #fff; border-radius: 18px; padding: 12px 10px; box-shadow: var(--shadow); }
.grid-h .hd { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); padding-bottom: 2px; }
.grid-h .fr { font-size: 11px; font-weight: 700; color: var(--ink); line-height: 1.2; display: flex; flex-direction: column; justify-content: center; }
.grid-h .fr small { font-weight: 600; color: var(--muted); font-size: 10.5px; }
.cell { aspect-ratio: 1; border-radius: 9px; background: #eef2f3; border: 1.5px solid transparent; transition: background .12s, transform .1s; }
.cell.on { background: var(--p); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
.cell:active { transform: scale(.92); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--text); padding: 4px 0; }
.check input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid #b8c6c9; flex: none; display: grid; place-items: center; background: #fff; margin-top: -1px; }
.check input:checked { background: var(--p); border-color: var(--p); }
.check input:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); }
.privacy-box { border-radius: 16px; background: var(--p-soft); padding: 13px 15px; font-size: 13px; color: var(--p); display: flex; gap: 10px; }
.wz-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(242,245,246,0), var(--bg) 35%); display: flex; gap: 10px; z-index: 20; }
.wz-bar .btn-a { flex: 1; }

/* App */
.top { position: sticky; top: 0; z-index: 15; padding: 14px 18px 12px; padding-top: calc(14px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; align-items: center; gap: 12px; }
.top .gym-logo { width: 38px; height: 38px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); }
.top b { display: block; font-size: 17px; color: var(--ink); font-weight: 900; letter-spacing: -.01em; line-height: 1.2; }
.top span { font-size: 12px; color: var(--muted); font-weight: 600; }
.top .me { margin-left: auto; }
.top .me .avatar { width: 38px; height: 38px; font-size: 14px; }
.view { padding: 4px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
.sec-h h2 { font-size: 20px; color: var(--ink); font-weight: 900; letter-spacing: -.02em; }
.sec-h span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.pause-banner { display: flex; gap: 10px; align-items: center; border-radius: 16px; padding: 12px 14px; background: #fff4e0; color: #7a4a00; font-size: 13.5px; font-weight: 600; }
.pause-banner button { margin-left: auto; font-weight: 800; color: var(--p); text-decoration: underline; flex: none; }
.mate { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.mate-h { display: flex; gap: 14px; align-items: center; }
.mate-h .avatar { width: 58px; height: 58px; font-size: 20px; }
.mate-h b { display: block; font-size: 17px; color: var(--ink); font-weight: 800; line-height: 1.25; }
.mate-h > div:not(.score):not(.avatar) { min-width: 0; flex: 1; }
.mate-h .meta { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.mate-h .meta .dot { flex: none; margin-top: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.score { margin-left: auto; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--a) calc(var(--s) * 1%), #edf1f2 0); }
.score::before { content: ''; grid-area: 1/1; width: 52px; height: 52px; border-radius: 50%; background: #fff; }
.score b { grid-area: 1/1; position: relative; font-size: 15px; color: var(--ink); font-weight: 900; margin-top: -8px; }
.score small { grid-area: 1/1; position: relative; font-size: 7.5px; font-weight: 800; color: var(--muted); margin-top: 20px; letter-spacing: .02em; }
.frase { font-size: 14px; color: var(--text); font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #eef2f3; color: var(--text); }
.tag.p { background: var(--p-soft); color: var(--p); }
.coinc { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--p); background: var(--p-soft); border-radius: 12px; padding: 9px 11px; font-weight: 600; }
.coinc.none { color: var(--muted); background: #f1f4f5; }
.coinc .ico { width: 16px; height: 16px; margin-top: 1px; }
.mate-f { display: flex; gap: 8px; }
.mate-f .btn-a, .mate-f .btn-p, .mate-f .btn-wa { flex: 1; }
.state { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 14px; background: #eef2f3; color: var(--muted); }
.state.ok { background: var(--ok-soft); color: var(--ok); }
.icon-btn { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: #eef2f3; color: var(--muted); flex: none; }
.empty { text-align: center; padding: 34px 20px; background: #fff; border-radius: 22px; box-shadow: var(--shadow); display: grid; gap: 8px; justify-items: center; }
.empty .ei { width: 60px; height: 60px; border-radius: 18px; background: var(--p-soft); color: var(--p); display: grid; place-items: center; }
.empty .ei .ico { width: 28px; height: 28px; }
.empty h3 { color: var(--ink); font-size: 17px; }
.empty p { color: var(--muted); font-size: 14px; max-width: 320px; }
.req { background: var(--card); border-radius: 20px; padding: 15px; box-shadow: var(--shadow); display: grid; gap: 11px; }
.req.hot { box-shadow: 0 0 0 2px var(--a), var(--shadow); }
.req-h { display: flex; gap: 12px; align-items: center; }
.req-h .avatar { width: 48px; height: 48px; font-size: 17px; }
.req-h b { display: block; color: var(--ink); font-size: 15.5px; }
.req-h span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.req .when { display: flex; gap: 8px; align-items: center; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.req .when .ico { color: var(--a); width: 17px; height: 17px; }
.bubble { background: #e4f6dd; border-radius: 4px 14px 14px 14px; padding: 10px 13px; font-size: 14px; color: #13281a; }
.duo-stats { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; }
.duo-stats b { color: var(--ok); font-size: 15px; }
.prof { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; justify-items: center; text-align: center; }
.prof .avatar { width: 88px; height: 88px; font-size: 30px; }
.prof h2 { font-size: 22px; color: var(--ink); font-weight: 900; }
.list { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-top: 1px solid var(--line); width: 100%; text-align: left; font-size: 15px; font-weight: 600; color: var(--ink); }
.row:first-child { border-top: 0; }
.row .ri { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--p-soft); color: var(--p); flex: none; font-weight: 900; }
.row .ri .ico { width: 18px; height: 18px; }
.row small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.row .end { margin-left: auto; color: var(--muted); }
.row.danger { color: var(--bad); }
.row.danger .ri { background: var(--bad-soft); color: var(--bad); }
.switch { margin-left: auto; width: 50px; height: 30px; border-radius: 99px; background: #cfd8da; position: relative; flex: none; transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .18s; }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(20px); }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); padding: 6px 0 0; }
.foot b { color: var(--p); }

/* Barra inferior */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255,255,255,.96); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; z-index: 30; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--muted); position: relative; }
.tab .ico { width: 23px; height: 23px; }
.tab.on { color: var(--p); }
.tab.on::before { content: ''; position: absolute; top: 0; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--a); }

/* Hojas */

.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 90; opacity: 0; visibility: hidden; transition: opacity .2s, transform .2s, visibility .2s; width: max-content; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 16px 30px -12px rgba(0,0,0,.4); }

<script>
(function () {
'use strict';
const API = 'https://landing-page-beta-ivory-99.vercel.app/api/duo';
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo');
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

const ico = (n) => '<svg class="ico" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

const DIAS_C = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const DIAS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const DIAS_M = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const FR = [['Primera hora', '6–9'], ['Mañana', '9–13'], ['Mediodía', '13–16'], ['Tarde', '16–20'], ['Noche', '20–23']];
const FR_TXT = ['a primera hora', 'por la mañana', 'al mediodía', 'por la tarde', 'por la noche'];
const NIVELES = [['empezando', 'Empezando'], ['intermedio', 'Intermedio'], ['avanzado', 'Avanzado']];
const TAGS = [['sala', 'Sala de pesas'], ['cardio', 'Cardio'], ['clases', 'Clases'], ['funcional', 'Funcional'], ['running', 'Running'], ['movilidad', 'Movilidad']];
const GENEROS = [['mujer', 'Mujer'], ['hombre', 'Hombre'], ['otro', 'Otro'], ['nd', 'Prefiero no decirlo']];
const NOTAS = ['¿Hacemos la rutina juntos?', 'Me vendría bien alguien para las series', '¿Te animas a una clase?', 'Busco constancia: ¿quedamos fijo?'];
const lbl = (list, k) => (list.find((x) => x[0] === k) || [k, k])[1];
const slotCorto = (s) => { const [d, f] = String(s).split('-').map(Number); return DIAS_M[d] + ' · ' + FR[f][0].toLowerCase(); };
const slotTxt = (s) => { if (s === 'flex') return 'cuando os venga bien'; const [d, f] = String(s).split('-').map(Number); return 'el ' + DIAS[d] + ' ' + FR_TXT[f]; };
const iniciales = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();

let gym = null, token = '', yo = null, comp = [], buzon = { recibidas: [], enviadas: [], duos: [] };
let tab = 'comp', filtro = 'todos', borrador = null, paso = 0, editando = false, pollTimer = null;
const FOTOS = {}; // id → { fv, src }: cada foto se descarga una vez por sesión

/* ── Aviso ── */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); }

/* ── Llamadas (servidor real o demostración) ── */
async function api(accion, datos) {
  if (DEMO) return Demo.handle(accion, Object.assign({}, datos));
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ accion, token }, datos || {})) }).catch(() => null);
  if (!r) throw Object.assign(new Error('No hay conexión. Revisa tu internet.'), { status: 0 });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d.ok) throw Object.assign(new Error(d.error || 'Algo ha fallado. Inténtalo de nuevo.'), { status: r.status });
  return d;
}

/* ── Marca del gimnasio ── */
const objetivo = (k) => (gym && gym.objetivos.find((o) => o.k === k)) || { k, nombre: k, color: '#94a3b8' };
function aplicarMarca() {
  document.documentElement.style.setProperty('--p', gym.primario || '#003b46');
  document.documentElement.style.setProperty('--a', gym.acento || '#e05e00');
  $('meta[name="theme-color"]').content = gym.primario || '#003b46';
  document.title = 'Activo Dúo · ' + gym.nombre;
}
const logoHTML = () => '<div class="gym-logo">' + (gym.logo ? '<img src="' + esc(gym.logo) + '" alt="">' : esc(iniciales(gym.nombre))) + '</div>';
const fotoDe = (p) => p.foto || (p.fv && FOTOS[p.id] && FOTOS[p.id].fv === p.fv ? FOTOS[p.id].src : '');
const avatar = (p, ring) => { const f = fotoDe(p); return '<div class="avatar' + (ring ? ' ring' : '') + '" style="--ring:' + esc(objetivo(p.objetivo).color) + '">' + (f ? '<img src="' + esc(f) + '" alt="">' : esc(iniciales(p.nombre))) + '</div>'; };

/* ── Pantallas ── */
function pantalla(html) { $('#screen').innerHTML = html; window.scrollTo(0, 0); }
function error(titulo, texto) {
  $('#tabs').hidden = true;
  pantalla('<div class="center err"><div><div class="ico-big">' + ico('qr') + '</div><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div></div>');
}

function bienvenida() {
  $('#tabs').hidden = true;
  const puede = DEMO || !!qs.get('c');
  pantalla('<section class="hero"><div class="gym-row">' + logoHTML() + '<div><b>' + esc(gym.nombre) + '</b><span>ACTIVO DÚO</span></div></div>' +
    '<h1>Entrena <em>acompañado.</em></h1><p>Encuentra en ' + esc(gym.nombre) + ' a gente con tu mismo objetivo y tu mismo horario. Sin vergüenza: la app rompe el hielo por ti.</p>' +
    '<div class="bands">' + gym.objetivos.map((o) => '<span class="band"><i style="background:' + esc(o.color) + '"></i>' + esc(o.nombre) + '</span>').join('') + '</div></section>' +
    '<div class="welcome-b">' +
    feat('band', 'Tu pulsera dice lo que buscas', 'Cada color es un objetivo. Si ves a alguien con la tuya, ya tenéis algo en común.') +
    feat('clock', 'Coincidís en horario', 'Te enseñamos quién viene los mismos días y a las mismas horas que tú.') +
    feat('shield', 'Tú decides con quién', 'Tu móvil solo lo ve quien acepte entrenar contigo. Puedes pausar o borrar tu perfil cuando quieras.') +
    '<p class="note">Sin descargar nada · 1 minuto · <button class="link" data-act="privacidad">Privacidad</button></p></div>' +
    '<div class="cta-bar">' + (puede ? '<button class="btn btn-a btn-block" data-act="empezar">Encontrar compañero ' + ico('send') + '</button><small>Solo para socios de ' + esc(gym.nombre) + ' mayores de 18 años</small>'
      : '<div class="privacy-box">' + ico('qr') + '<div>Para unirte, <b>escanea el código QR</b> de los carteles de tu gimnasio.</div></div>') + '</div>');
}
const feat = (i, t, d) => '<div class="feat"><div class="fi">' + ico(i) + '</div><div><b>' + esc(t) + '</b><span>' + esc(d) + '</span></div></div>';

/* ── Alta y edición en 5 pasos ── */
const PASOS = ['nombre', 'objetivo', 'actividad', 'horario', 'preferencias'];
function empezar(editar) {
  editando = !!editar;
  borrador = editar && yo ? JSON.parse(JSON.stringify(yo)) : { nombre: '', foto: '', frase: '', objetivo: '', nivel: 'intermedio', tags: [], horario: [], genero: 'nd', pref: 'todos', tel: '', mayor18: false, acepto: false };
  if (editar && borrador.tel && borrador.tel.startsWith('34') && borrador.tel.length === 11) borrador.tel = borrador.tel.slice(2);
  paso = 0; asistente();
}
function asistente() {
  $('#tabs').hidden = true;
  const b = borrador, total = PASOS.length;
  let cuerpo = '';
  if (paso === 0) cuerpo = '<h2>¿Cómo te llamamos?</h2><p class="sub">Tu nombre o un apodo. Así te verán tus compañeros.</p>' +
    '<label class="field"><span>Nombre o apodo</span><input class="input" id="fNombre" maxlength="30" autocomplete="given-name" placeholder="Laura" value="' + esc(b.nombre) + '"></label>' +
    '<div class="field"><span>Foto (opcional)</span><div class="photo">' + avatar(b) + '<div style="display:grid;gap:6px"><button class="btn btn-o btn-sm" data-act="foto">' + ico('camera') + (b.foto ? 'Cambiar foto' : 'Añadir foto') + '</button>' + (b.foto ? '<button class="link" data-act="foto-quitar">Quitar foto</button>' : '') + '</div></div><small>Con foto es más fácil reconoceros en la sala.</small></div>' +
    '<label class="field"><span>Una frase sobre ti (opcional)</span><textarea class="textarea" id="fFrase" maxlength="120" placeholder="Me cuesta ser constante: busco a alguien para animarnos.">' + esc(b.frase) + '</textarea></label>';
  if (paso === 1) cuerpo = '<h2>¿Cuál es tu objetivo?</h2><p class="sub">Es el color de tu pulsera en el gimnasio.</p><div class="opts">' +
    gym.objetivos.map((o) => '<button class="opt' + (b.objetivo === o.k ? ' on' : '') + '" data-act="w-obj" data-k="' + esc(o.k) + '"><span class="pul" style="background:' + esc(o.color) + '"></span><div><b>' + esc(o.nombre) + '</b><span>Pulsera ' + esc(nombreColor(o.color)) + '</span></div><span class="chk">' + ico('check') + '</span></button>').join('') +
    '</div><div class="field"><span>Tu nivel</span><div class="seg">' + NIVELES.map((n) => '<button class="' + (b.nivel === n[0] ? 'on' : '') + '" data-act="w-nivel" data-k="' + n[0] + '">' + n[1] + '</button>').join('') + '</div></div>';
  if (paso === 2) cuerpo = '<h2>¿Qué sueles entrenar?</h2><p class="sub">Marca todo lo que te guste. Puedes elegir varias.</p><div class="chips">' +
    TAGS.map((t) => '<button class="chip' + (b.tags.includes(t[0]) ? ' on' : '') + '" data-act="w-tag" data-k="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
  if (paso === 3) cuerpo = '<h2>¿Cuándo sueles venir?</h2><p class="sub">Toca las franjas en las que entrenas. Así te emparejamos con quien coincide contigo.</p>' +
    '<div class="grid-h"><span></span>' + DIAS_C.map((d) => '<span class="hd">' + d + '</span>').join('') +
    FR.map((f, fi) => '<span class="fr">' + f[0] + '<small>' + f[1] + '</small></span>' + DIAS_C.map((_, di) => { const s = di + '-' + fi; return '<button class="cell' + (b.horario.includes(s) ? ' on' : '') + '" data-act="w-slot" data-s="' + s + '" aria-label="' + DIAS[di] + ' ' + f[0] + '" aria-pressed="' + b.horario.includes(s) + '"></button>'; }).join('')).join('') +
    '</div><p class="note" id="nSlots">' + b.horario.length + ' ' + (b.horario.length === 1 ? 'franja marcada' : 'franjas marcadas') + '</p>';
  if (paso === 4) cuerpo = '<h2>Últimos detalles</h2><p class="sub">Para que solo te escriba la gente con la que de verdad te apetece entrenar.</p>' +
    '<label class="field"><span>Género</span><select class="select" id="fGenero">' + GENEROS.map((g) => '<option value="' + g[0] + '"' + (b.genero === g[0] ? ' selected' : '') + '>' + g[1] + '</option>').join('') + '</select></label>' +
    '<div class="field"><span>¿Con quién prefieres entrenar?</span><div class="seg two"><button class="' + (b.pref !== 'mismo' ? 'on' : '') + '" data-act="w-pref" data-k="todos">Me da igual</button><button class="' + (b.pref === 'mismo' ? 'on' : '') + '" data-act="w-pref" data-k="mismo">Mi mismo género</button></div><small id="prefHint">' + (b.genero === 'nd' ? 'Para elegir «mi mismo género» indica tu género.' : 'Solo verás, y solo te verán, personas compatibles con esta preferencia.') + '</small></div>' +
    '<label class="field"><span>Tu móvil con WhatsApp</span><input class="input" id="fTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="612 345 678" value="' + esc(b.tel) + '"><small>Solo lo verá quien acepte entrenar contigo.</small></label>' +
    (editando ? '' : '<label class="check"><input type="checkbox" id="fMayor"' + (b.mayor18 ? ' checked' : '') + '><span>Soy mayor de 18 años.</span></label>' +
      '<label class="check"><input type="checkbox" id="fAcepto"' + (b.acepto ? ' checked' : '') + '><span>Acepto la <button class="link" data-act="privacidad">política de privacidad</button> de Activo Dúo en ' + esc(gym.nombre) + '.</span></label>');
  pantalla((DEMO ? '' : '') + '<div class="wz-top"><div class="wz-nav"><button class="btn-g btn btn-sm" data-act="w-atras">' + ico('back') + (paso ? 'Atrás' : (editando ? 'Cancelar' : 'Salir')) + '</button><span class="step">PASO ' + (paso + 1) + ' DE ' + total + '</span></div><div class="prog"><i style="width:' + ((paso + 1) / total * 100) + '%"></i></div></div>' +
    '<div class="wz-b">' + cuerpo + '</div><div class="wz-bar"><button class="btn btn-a" data-act="w-sig">' + (paso === total - 1 ? (editando ? 'Guardar cambios' : 'Unirme a Activo Dúo') : 'Siguiente') + '</button></div>');
  const f = $('#fNombre'); if (f && !b.nombre) setTimeout(() => f.focus(), 50);
}
function nombreColor(hex) {
  const m = { '#2563eb': 'azul', '#dc2626': 'roja', '#ea580c': 'naranja', '#9333ea': 'morada', '#16a34a': 'verde' };
  return m[String(hex).toLowerCase()] || 'de este color';
}
function leerPaso() {
  const b = borrador;
  if (paso === 0) { b.nombre = $('#fNombre').value.trim(); b.frase = $('#fFrase').value.trim(); if (b.nombre.length < 2) return 'Escribe tu nombre o un apodo.'; }
  if (paso === 1 && !b.objetivo) return 'Elige tu objetivo.';
  if (paso === 3 && !b.horario.length) return 'Marca al menos una franja.';
  if (paso === 4) {
    b.genero = $('#fGenero').value; b.tel = $('#fTel').value.trim();
    if (b.genero === 'nd') b.pref = 'todos';
    if (b.tel.replace(/\D/g, '').length < 9) return 'Escribe tu móvil con WhatsApp.';

async function cargarFotos() {
  const pend = {};
  comp.concat(buzon.recibidas.map((s) => s.otro), buzon.enviadas.map((s) => s.otro), buzon.duos.map((s) => s.otro))
    .forEach((p) => { if (p && p.fv && !(FOTOS[p.id] && FOTOS[p.id].fv === p.fv)) pend[p.id] = p.fv; });
  const ids = Object.keys(pend).slice(0, 60);
  if (!ids.length) return;
  ids.forEach((id) => { FOTOS[id] = { fv: pend[id], src: '' }; });
  try { const d = await api('fotos', { ids }); Object.keys(d.fotos || {}).forEach((id) => { FOTOS[id].src = d.fotos[id]; }); pintar(); } catch (e) {}
}

    c.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
    borrador.nombre = ($('#fNombre') || {}).value || borrador.nombre; borrador.frase = ($('#fFrase') || {}).value || borrador.frase;
    borrador.foto = c.toDataURL('image/jpeg', 0.78); URL.revokeObjectURL(url); asistente();
  };
  img.onerror = () => toast('No hemos podido leer esa foto.');
  img.src = url;
});

/* ── Avisos al móvil ── */
async function activarAvisos() {
  if (DEMO) { toast('En la demostración los avisos no se activan.'); return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    if (IOS && !STANDALONE) { hojaIOS(); return; }
    toast('Tu navegador no permite avisos.'); return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Has bloqueado los avisos. Puedes activarlos en los ajustes del navegador.'); return; }
    const reg = await navigator.serviceWorker.register('duo-sw.js', { scope: './duo' });
    await navigator.serviceWorker.ready;
    const { key } = await api('vapid');
    const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((key.length + 3) % 4));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, (ch) => ch.charCodeAt(0)) });
    await api('push', { sub: sub.toJSON() });
    store.set('activo-duo:push:' + gym.slug, '1'); toast('Avisos activados'); pintar();
  } catch (e) { toast('No hemos podido activar los avisos.'); }
}

/* ── Sondeo suave ── */
function arrancarSondeo() { clearInterval(pollTimer); pollTimer = setInterval(() => { if (!document.hidden && !$('#sheet').classList.contains('open')) refrescar(false); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && yo && token) refrescar(true); });

function salir(msg) {
  clearInterval(pollTimer);
  if (!DEMO) store.del('activo-duo:' + gym.slug);
  token = ''; yo = null; cerrarHoja();
  bienvenida(); if (msg) toast(msg);
}

/* ── Acciones ── */
const ACC = {
  'empezar': () => empezar(false),
  'editar': () => empezar(true),
  'foto': () => { borrador.nombre = $('#fNombre').value; borrador.frase = $('#fFrase').value; $('#fotoInput').value = ''; $('#fotoInput').click(); },
  'foto-quitar': () => { borrador.nombre = $('#fNombre').value; borrador.frase = $('#fFrase').value; borrador.foto = ''; asistente(); },
  'w-obj': (el) => { borrador.objetivo = el.dataset.k; $$('.opt').forEach((x) => x.classList.toggle('on', x.dataset.k === el.dataset.k)); },
  'w-nivel': (el) => { borrador.nivel = el.dataset.k; $$('[data-act="w-nivel"]').forEach((x) => x.classList.toggle('on', x === el)); },
  'w-tag': (el) => { const k = el.dataset.k, t = borrador.tags; const i = t.indexOf(k); if (i >= 0) t.splice(i, 1); else t.push(k); el.classList.toggle('on', i < 0); },
  'w-slot': (el) => { const s = el.dataset.s, h = borrador.horario; const i = h.indexOf(s); if (i >= 0) h.splice(i, 1); else h.push(s); el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', i < 0); $('#nSlots').textContent = h.length + ' ' + (h.length === 1 ? 'franja marcada' : 'franjas marcadas'); },
  'w-pref': (el) => { if (el.dataset.k === 'mismo' && $('#fGenero').value === 'nd') { toast('Indica tu género para elegir esta opción.'); return; } borrador.pref = el.dataset.k; $$('[data-act="w-pref"]').forEach((x) => x.classList.toggle('on', x === el)); },
  'w-atras': () => { if (paso === 0) { if (editando) abrirApp('perfil'); else bienvenida(); return; } if (paso === 4) { borrador.genero = $('#fGenero').value; borrador.tel = $('#fTel').value; } if (paso === 0) leerPaso(); paso--; asistente(); },
  'w-sig': () => { const err = leerPaso(); if (err) { toast(err); return; } if (paso < PASOS.length - 1) { paso++; asistente(); } else terminarAlta(); },
  'filtro': (el) => { filtro = el.dataset.k; pintar(); },
  'proponer': (el) => hojaProponer(el.dataset.id),
  'p-slot': (el) => { propuesta.slot = el.dataset.s; $$('[data-act="p-slot"]').forEach((x) => x.classList.toggle('on', x === el)); },
  'p-nota': (el) => { $('#pNota').value = el.dataset.n; },
  'p-enviar': async (el) => {
    el.disabled = true;
    try { await api('proponer', { a: propuesta.a, slot: propuesta.slot, nota: $('#pNota').value }); cerrarHoja(); toast('Propuesta enviada. Te avisaremos cuando conteste.'); await refrescar(true); }
    catch (e) { el.disabled = false; toast(e.message); }
  },
  'responder': async (el) => {
    el.disabled = true;
    try {
      const acepto = el.dataset.v === '1';
      const s = buzon.recibidas.find((x) => x.id === el.dataset.id);
      const d = await api('responder', { id: el.dataset.id, acepto });
      await refrescar(true);
      if (acepto && s) celebrar(Object.assign({}, s, { tel: d.tel })); else toast('Respondido. No le diremos el motivo.');
    } catch (e) { el.disabled = false; toast(e.message); }
  },
  'cancelar': async (el) => { try { await api('cancelar', { id: el.dataset.id }); cerrarHoja(); toast('Hecho'); await refrescar(true); } catch (e) { toast(e.message); } },
  'entreno': async (el) => { try { await api('entreno', { id: el.dataset.id }); toast('¡Entreno apuntado! 🔥 Seguid así.'); await refrescar(false); } catch (e) { toast(e.message); } },
  'menu': (el) => hojaMenu(el.dataset.id),
  'menu-duo': (el) => hojaMenuDuo(el.dataset.id, el.dataset.o),
  'bloquear': async (el) => { if (!confirm('¿Bloquear a esta persona? No os volveréis a ver en Activo Dúo.')) return; try { await api('bloquear', { a: el.dataset.id }); cerrarHoja(); toast('Bloqueado'); await refrescar(true); } catch (e) { toast(e.message); } },
  'reportar': (el) => hojaReportar(el.dataset.id),
  'r-motivo': (el) => { $('#rMotivo').value = el.dataset.m; },
  'r-enviar': async (el) => { el.disabled = true; try { await api('reportar', { a: el.dataset.id, motivo: $('#rMotivo').value }); cerrarHoja(); toast('Gracias. Hemos avisado al gimnasio.'); await refrescar(true); } catch (e) { el.disabled = false; toast(e.message); } },
  'pausa': async (el) => { try { const d = await api('pausa', { pausado: el.dataset.v === '1' }); yo = d.yo; toast(yo.pausado ? 'Perfil en pausa: nadie te ve.' : '¡Vuelves a estar visible!'); await refrescar(true); } catch (e) { toast(e.message); } },
  'avisos': () => activarAvisos(),
  'pulseras': hojaPulseras,
  'privacidad': hojaPrivacidad,
  'cerrar': cerrarHoja,
  'ios-hecho': () => { history.replaceState(null, '', location.pathname + '?g=' + encodeURIComponent(gym.slug)); cerrarHoja(); },
  'salir': () => salir('Sesión cerrada en este móvil.'),
  'borrar': async () => { if (!confirm('¿Borrar tu perfil? Se eliminarán tus datos y tus dúos. No se puede deshacer.')) return; try { await api('borrar'); store.del('activo-duo:push:' + gym.slug); salir('Tu perfil se ha borrado.'); } catch (e) { toast(e.message); } },
  'wa': (el, e) => { if (DEMO) { e.preventDefault(); toast('En la demostración no se abre WhatsApp: con socios reales, sí.'); } },
  'demo-reset': () => { Demo.reset(); location.reload(); }
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (t && yo) { e.preventDefault(); cerrarHoja(); if (t.dataset.tab !== tab || !$('#view')) abrirApp(t.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACC[el.dataset.act]; if (!fn) return;
  const enlace = el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#';
  if (!enlace) e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', (e) => { if (e.target.id === 'fGenero') { const nd = e.target.value === 'nd'; if (nd && borrador.pref === 'mismo') { borrador.pref = 'todos'; $$('[data-act="w-pref"]').forEach((x) => x.classList.toggle('on', x.dataset.k === 'todos')); } $('#prefHint').textContent = nd ? 'Para elegir «mi mismo género» indica tu género.' : 'Solo verás, y solo te verán, personas compatibles con esta preferencia.'; } });

/* ══ Modo demostración: gimnasio y socios de ejemplo, sin servidor ══ */
const Demo = (function () {
  const KEY = 'activo-duo:demo:v1';
  const OBJ = [{ k: 'fuerza', nombre: 'Fuerza y músculo', color: '#2563eb' }, { k: 'cardio', nombre: 'Cardio y resistencia', color: '#dc2626' }, { k: 'funcional', nombre: 'Funcional y clases', color: '#ea580c' }, { k: 'bienestar', nombre: 'Tonificar y bienestar', color: '#9333ea' }, { k: 'empezando', nombre: 'Estoy empezando', color: '#16a34a' }];
  const GYM = { slug: 'demo', nombre: 'FitBox Norte', ciudad: 'Santander', logo: '', primario: '#003b46', acento: '#e05e00', objetivos: OBJ, contacto: 'hola@fitboxnorte.es' };
  const S = (n, g, o, l, t, h, f) => ({ id: 'd' + n.replace(/\W/g, ''), nombre: n, genero: g, pref: 'todos', objetivo: o, nivel: l, tags: t, horario: h, frase: f, foto: '', tel: '34600000000', activo: true, pausado: false });
  const SOCIOS = [
    S('Laura M.', 'mujer', 'fuerza', 'intermedio', ['sala', 'movilidad'], ['0-3', '2-3', '4-1'], 'Busco a alguien constante para la rutina de pierna.'),
    S('Javier R.', 'hombre', 'fuerza', 'avanzado', ['sala'], ['0-4', '1-4', '3-4'], 'Llevo 5 años entrenando: te ayudo con la técnica.'),
    S('Sara G.', 'mujer', 'cardio', 'intermedio', ['running', 'cardio'], ['1-0', '3-0', '5-1'], 'Preparando mi primera media maratón.'),
    S('Dani P.', 'hombre', 'funcional', 'intermedio', ['funcional', 'clases'], ['0-3', '2-3', '4-3'], '¿Alguien para el funcional de las 18:00?'),
    S('Marta L.', 'mujer', 'bienestar', 'empezando', ['clases', 'movilidad'], ['1-2', '3-2'], 'Vengo a mediodía y me aburro sola.'),
    S('Íker S.', 'hombre', 'empezando', 'empezando', ['sala', 'cardio'], ['0-3', '1-3', '3-3'], 'Acabo de empezar y no sé por dónde tirar.'),
    S('Nuria T.', 'mujer', 'fuerza', 'empezando', ['sala'], ['0-3', '2-3'], 'Quiero perderle el miedo a la zona de pesas.'),
    S('Álex C.', 'otro', 'cardio', 'avanzado', ['running'], ['0-0', '2-0', '4-0'], 'Rodajes a primera hora, ritmo tranquilo.'),
    S('Paula V.', 'mujer', 'funcional', 'avanzado', ['funcional', 'sala'], ['1-3', '3-3', '5-1'], 'Me motiva competir un poco 😄'),
    S('Rubén A.', 'hombre', 'bienestar', 'intermedio', ['movilidad', 'clases'], ['0-4', '2-4'], 'Después del trabajo, para desconectar.'),
    S('Elena F.', 'mujer', 'cardio', 'empezando', ['cardio', 'clases'], ['0-3', '2-3', '4-3'], 'Busco compañera para las clases de spinning.'),
    S('Hugo B.', 'hombre', 'fuerza', 'intermedio', ['sala', 'funcional'], ['1-3', '3-3', '0-3'], 'Push, pull, legs. ¿Te apuntas?')
  ];
  const LV = { empezando: 0, intermedio: 1, avanzado: 2 };
  function compat(a, b) { const comunes = a.horario.filter((s) => b.horario.includes(s)); let score = Math.min(comunes.length, 3) / 3 * 50; if (a.objetivo === b.objetivo) score += 25; const dl = Math.abs(LV[a.nivel] - LV[b.nivel]); score += dl === 0 ? 15 : dl === 1 ? 7 : 0; const ta = new Set(a.tags), u = new Set([...a.tags, ...b.tags]).size; score += u ? 10 * b.tags.filter((t) => ta.has(t)).length / u : 0; return { score: Math.round(score), comunes }; }
  const genOk = (a, b) => !((a.pref === 'mismo' && a.genero !== b.genero) || (b.pref === 'mismo' && b.genero !== a.genero));
  const pub = (m) => ({ id: m.id, nombre: m.nombre, foto: m.foto, frase: m.frase, objetivo: m.objetivo, nivel: m.nivel, tags: m.tags, horario: m.horario });
  let st = null;
  const load = () => { try { st = JSON.parse(store.get(KEY) || 'null'); } catch (e) { st = null; } if (!st) st = { yo: null, sols: [], bloq: [] }; };
  const save = () => store.set(KEY, JSON.stringify(st));
  const fail = (status, msg) => { throw Object.assign(new Error(msg), { status }); };
  const todos = () => SOCIOS.concat(st.yo ? [st.yo] : []);
  const byId = (id) => todos().find((m) => m.id === id);
  const rel = (o) => { const s = st.sols.find((x) => ((x.de === 'yo' && x.a === o) || (x.a === 'yo' && x.de === o)) && (x.estado === 'pendiente' || x.estado === 'aceptada')); return s ? (s.estado === 'aceptada' ? 'duo' : s.de === 'yo' ? 'enviada' : 'recibida') : null; };
  async function handle(accion, p) {
    await new Promise((r) => setTimeout(r, 220));
    load();
    if (accion === 'gym') return { ok: true, gym: GYM };
    if (accion === 'unirme') {
      st.yo = Object.assign({}, p.perfil, { id: 'yo', tel: '34' + String(p.perfil.tel).replace(/\D/g, '').slice(-9), activo: true, pausado: false });
      if (st.yo.genero === 'nd') st.yo.pref = 'todos';
      st.sols = [{ id: 'r1', de: 'dJavierR', a: 'yo', slot: '0-4', nota: '¿Te animas a pierna el lunes? Te enseño la técnica.', estado: 'pendiente', creado: new Date().toISOString() }];
      save(); return { ok: true, token: 'demo', yo: st.yo, gym: GYM };
    }
    if (!st.yo) fail(401, 'Empieza de nuevo la demostración.');
    const yo = st.yo;
    if (accion === 'yo') return { ok: true, yo, gym: GYM };
    if (accion === 'perfil') { Object.assign(yo, p.perfil); if (yo.genero === 'nd') yo.pref = 'todos'; save(); return { ok: true, yo }; }
    if (accion === 'pausa') { yo.pausado = !!p.pausado; save(); return { ok: true, yo }; }
    if (accion === 'borrar') { reset(); return { ok: true }; }
    if (accion === 'vapid' || accion === 'push') return { ok: true, key: '' };
    if (accion === 'fotos') return { ok: true, fotos: {} };
    if (accion === 'compatibles') return { ok: true, compatibles: SOCIOS.filter((o) => !st.bloq.includes(o.id) && genOk(yo, o)).map((o) => { const c = compat(yo, o); return Object.assign(pub(o), { score: c.score, comunes: c.comunes, relacion: rel(o.id) }); }).sort((a, b) => b.score - a.score) };
    if (accion === 'buzon') {
      const r = { ok: true, recibidas: [], enviadas: [], duos: [] };
      st.sols.forEach((s) => { const otro = byId(s.de === 'yo' ? s.a : s.de); if (!otro || st.bloq.includes(otro.id)) return; if (s.estado === 'pendiente') (s.a === 'yo' ? r.recibidas : r.enviadas).push(Object.assign({}, s, { otro: pub(otro) })); else if (s.estado === 'aceptada') r.duos.push(Object.assign({}, s, { otro: pub(otro), tel: otro.tel })); });
      return r;
    }
    if (accion === 'proponer') {
      if (rel(p.a)) fail(409, 'Ya tenéis una propuesta en marcha.');
      const s = { id: 'r' + Date.now(), de: 'yo', a: p.a, slot: p.slot, nota: p.nota, estado: 'pendiente', creado: new Date().toISOString() };
      st.sols.push(s); save();
      setTimeout(() => { load(); const x = st.sols.find((y) => y.id === s.id); if (x && x.estado === 'pendiente') { x.estado = 'aceptada'; x.resp = new Date().toISOString(); save(); toast('🎉 ' + byId(p.a).nombre + ' ha aceptado tu propuesta. Mira «Solicitudes».'); refrescar(true); } }, 4000);
      return { ok: true, solicitud: s };
    }
    const s = st.sols.find((x) => x.id === p.id);
    if (accion === 'responder') { if (!s) fail(404, 'Ya no está pendiente.'); s.estado = p.acepto ? 'aceptada' : 'rechazada'; s.resp = new Date().toISOString(); save(); return { ok: true, solicitud: s, tel: p.acepto ? '34600000000' : undefined }; }
    if (accion === 'cancelar') { if (s) s.estado = s.estado === 'aceptada' ? 'terminada' : 'cancelada'; save(); return { ok: true }; }
    if (accion === 'entreno') { if (!s) fail(404, 'No encontramos este dúo.'); if (s.ultimo === new Date().toISOString().slice(0, 10)) fail(409, 'Ya habéis apuntado el entreno de hoy. ¡Buen trabajo!'); s.entrenos = (s.entrenos || 0) + 1; s.ultimo = new Date().toISOString().slice(0, 10); save(); return { ok: true, solicitud: s }; }
    if (accion === 'bloquear' || accion === 'reportar') { st.bloq.push(p.a); st.sols.forEach((x) => { if (x.de === p.a || x.a === p.a) x.estado = 'cancelada'; }); save(); return { ok: true }; }
    fail(400, 'Acción no válida.');
  }
  function reset() { store.del(KEY); st = null; }
  return { handle, reset, GYM, sesion: () => { load(); return !!st.yo; } };
})();

/* ══ Arranque ══ */
(async function init() {
  if (DEMO) $('#demoBar').hidden = false;
  const g = DEMO ? 'demo' : (qs.get('g') || store.get('activo-duo:last') || '');
  if (!g) { error('Escanea el código QR', 'Para entrar en Activo Dúo, escanea el código QR de los carteles de tu gimnasio.'); return; }
  if (!DEMO && qs.get('t')) { store.set('activo-duo:' + g, qs.get('t')); history.replaceState(null, '', location.pathname + '?g=' + encodeURIComponent(g)); }
  try {
    gym = (await api('gym', { g })).gym; aplicarMarca();
    token = DEMO ? (Demo.sesion() ? 'demo' : '') : (store.get('activo-duo:' + g) || '');
    if (token) {
      try { yo = (await api('yo')).yo; if (!DEMO) store.set('activo-duo:last', g); abrirApp('comp'); return; }
      catch (e) { if (!DEMO && (e.status === 401 || e.status === 403)) store.del('activo-duo:' + g); token = ''; if (e.status === 403) toast(e.message); }
    }
    bienvenida();
  } catch (e) {
    error(e.status === 503 ? 'Activo Dúo aún no está activo' : e.status === 404 ? 'Gimnasio no encontrado' : 'Sin conexión', e.message);
  }
})();
})();
